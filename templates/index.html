<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriageBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
  <style>
    /* El indicador solo se ve mientras HTMX espera la respuesta. */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline-flex; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-6xl p-6 space-y-8">
    <header>
      <h1 class="text-3xl font-bold">TriageBot</h1>
      <p class="mt-2 text-slate-600">Tablero de incidencias con clasificación automática por IA.</p>
    </header>

    <!-- BLOQUE 1: formulario para crear tickets (otra rama). Al crear un ticket debe lanzar
         el evento "ticket-creado" para que el tablero se refresque (ver SPEC §7.1). -->

    <!-- BLOQUES 2 y 3: filtros + tablero -->
    {% include "_filtros.html" %}
    <!-- Bloque 1: formulario para crear tickets -->
    <section class="rounded-lg bg-white p-6 shadow-sm ring-1 ring-slate-200">
      <h2 class="text-xl font-semibold">Nuevo ticket</h2>

      <form id="form-ticket"
            class="mt-4 space-y-4"
            hx-post="/tickets"
            hx-ext="json-enc"
            hx-swap="none"
            hx-indicator="#clasificando"
            hx-disabled-elt="find button">
        <div>
          <label for="title" class="block text-sm font-medium">Título</label>
          <input id="title" name="title" type="text" required maxlength="200"
                 placeholder="Ej.: La app no carga"
                 class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>

        <div>
          <label for="description" class="block text-sm font-medium">Descripción</label>
          <textarea id="description" name="description" rows="4" required maxlength="5000"
                    placeholder="Describe el problema o la petición"
                    class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
        </div>

        <div class="flex items-center gap-4">
          <button type="submit"
                  class="rounded-md bg-indigo-600 px-4 py-2 font-medium text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50">
            Crear ticket
          </button>
          <span id="clasificando" class="htmx-indicator items-center gap-2 text-sm text-slate-600">
            <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"></circle>
              <path d="M4 12a8 8 0 018-8" stroke="currentColor" stroke-width="4" class="opacity-75"></path>
            </svg>
            Clasificando…
          </span>
        </div>

        <p id="form-mensaje" role="alert" class="hidden text-sm"></p>
      </form>
    </section>

    <!-- Bloque 2: tablero de tickets -->
    <section>
      <h2 class="mb-4 text-xl font-semibold">Tickets</h2>
      {% include "_tickets_table.html" %}
    </section>
  </main>

  <script>
    // Tras POST /tickets: limpiar el formulario si ha ido bien o mostrar un error legible.
    (function () {
      const form = document.getElementById("form-ticket");
      const mensaje = document.getElementById("form-mensaje");
      const CAMPOS = { title: "título", description: "descripción" };
      const LIMITES = { title: 200, description: 5000 };

      function mostrar(texto, esError) {
        mensaje.textContent = texto;
        mensaje.className = "text-sm " + (esError ? "text-red-700" : "text-green-700");
      }

      function textoError(detalle) {
        if (!Array.isArray(detalle)) return "Revisa los datos del formulario.";
        return detalle.map(function (err) {
          const campo = err.loc ? err.loc[err.loc.length - 1] : "";
          const nombre = CAMPOS[campo] || "formulario";
          if (err.type === "string_too_short" || err.type === "missing") {
            return "El campo " + nombre + " es obligatorio.";
          }
          if (err.type === "string_too_long") {
            return "El campo " + nombre + " no puede superar " + LIMITES[campo] + " caracteres.";
          }
          return "El campo " + nombre + " no es válido.";
        }).join(" ");
      }

      form.addEventListener("htmx:afterRequest", function (evt) {
        const xhr = evt.detail.xhr;
        if (evt.detail.successful) {
          form.reset();
          mostrar("Ticket creado y clasificado.", false);
        } else if (xhr.status === 422) {
          let detalle = null;
          try { detalle = JSON.parse(xhr.responseText).detail; } catch (e) { /* respuesta no JSON */ }
          mostrar(textoError(detalle), true);
        } else {
          mostrar("No se ha podido crear el ticket. Inténtalo de nuevo.", true);
        }
      });
    })();
  </script>
</body>
</html>
